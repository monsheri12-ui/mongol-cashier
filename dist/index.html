<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#194d43">
  <meta name="description" content="Уютный монгольский магазин. Назови сумму покупки по-монгольски, обслужи свою смену и разбери ошибки.">
  <title>Монгол дэлгүүр · Кассир</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='16' width='64' height='64' fill='%23194d43'/%3E%3Cpath d='M18 12h28v40l-5-4-5 4-5-4-5 4-8-4z' fill='%23fff0d1'/%3E%3Cpath d='M25 23h14M25 30h14M25 37h8' stroke='%23194d43' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=1.1.1">
  <link rel="stylesheet" href="intro.css?v=1.1.1">
  <link rel="preload" as="image" href="assets/world/table-v2/evening.webp">
</head>
<body class="is-booting">
  <section id="game-intro" class="game-intro" aria-label="Монгольский магазин — начало игры">
    <img class="intro-backdrop" src="assets/world/table-v2/evening.webp" alt="" fetchpriority="high">
    <div class="intro-tint"></div>
    <div class="intro-card">
      <div class="intro-welcome">
        <h1 lang="mn">Монгол<br><em>дэлгүүр</em></h1>
        <p class="intro-description">Назови сумму по-монгольски и помоги каждому покупателю оплатить покупки.</p>
        <button class="intro-start" data-intro-start disabled><span>Начать игру</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
      </div>
      <div class="intro-loading" hidden>
        <h2 lang="mn">Монгол<br><em>дэлгүүр</em></h2>
        <div class="intro-loader-art" aria-hidden="true"><span class="loader-receipt">₮<i></i><i></i><i></i></span><span class="loader-dot"></span></div>
        <div class="intro-progress-caption"><span>Загрузка</span><strong class="intro-percent">0%</strong></div>
        <div class="intro-progress" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="intro-progress-fill"></span></div>
        <p class="intro-load-status" aria-live="polite">Открываем двери магазина…</p>
        <button class="intro-start intro-retry" hidden>Попробовать ещё раз</button>
      </div>
    </div>
  </section>
  <div id="world" class="world" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><style>.game-intro{display:none}</style><div class="boot"><h1>Для игры нужен JavaScript</h1><p>Включите его в настройках браузера и обновите страницу.</p></div></noscript>
  <script type="module" src="app.js?v=1.1.1"></script>
</body>
</html>
